[package]
name = "vocal-time-counter"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
serenity = { version = "0.12.5", features = ["client", "gateway", "http", "model", "builder", "cache", "collector", "utils"] }
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.44"
poise = "0.6.2"
